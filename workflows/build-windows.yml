name: Build PSY - ZUMBO (Windows VST3)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Locate VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Filter "PSY - ZUMBO.vst3" | Select-Object -First 1
          if (-not $vst) {
            $vst = Get-ChildItem -Path build -Recurse -Filter "PSY_ZUMBO.vst3" | Select-Object -First 1
          }
          if (-not $vst) { throw "VST3 bundle was not produced." }
          "VST3_PATH=$($vst.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Found: $($vst.FullName)"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "$env:VST3_PATH" "package\PSY - ZUMBO.vst3"
          Copy-Item README.md package\README.md
          Compress-Archive -Path package\* -DestinationPath "PSY-ZUMBO-Windows-x64.zip" -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSY-ZUMBO-Windows-x64
          path: PSY-ZUMBO-Windows-x64.zip
          if-no-files-found: error
